<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>lingshu-ng 控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236366f1'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3E%E7%81%B5%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/console/app.css">
<script src="/console/app.js" defer></script>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="navigation">
    <div class="brand">
      <span class="logo" aria-hidden="true">灵</span>
      <span class="names"><span class="name">lingshu-ng</span><span class="sub" data-i18n="console">控制台</span></span>
    </div>
    <div class="nav-label" data-i18n="nav_workspace">工作区</div>
    <nav id="tabs" class="tabs" aria-label="sections">
      <button type="button" data-view="overview" data-icon="grid" data-key="1"><span class="lbl" data-i18n="tab_overview">概览</span></button>
      <button type="button" data-view="search" data-icon="search" data-key="2"><span class="lbl" data-i18n="tab_search">检索</span></button>
      <button type="button" data-view="browse" data-icon="layers" data-key="3"><span class="lbl" data-i18n="tab_browse">记忆浏览</span></button>
      <button type="button" data-view="write" data-icon="pen" data-key="4"><span class="lbl" data-i18n="tab_write">写入</span></button>
      <button type="button" data-view="exchange" data-icon="swap" data-key="5"><span class="lbl" data-i18n="tab_exchange">导入/导出</span></button>
      <button type="button" data-view="health" data-icon="pulse" data-key="6"><span class="lbl" data-i18n="tab_health">健康</span></button>
    </nav>
    <div class="side-foot">
      <div class="conn" id="conn"><span class="dot" id="conn-dot"></span><span class="meta"><b id="conn-title">—</b><span id="conn-sub"></span></span></div>
    </div>
  </aside>
  <div class="main-col">
    <header class="topbar">
      <button type="button" id="menu" class="ghost icon menu-btn" aria-label="menu"></button>
      <div class="crumbs"><span>lingshu-ng</span><span class="faint">/</span><b id="crumb"></b></div>
      <div class="tools">
        <button type="button" id="kbd-help" class="ghost icon" title="?" aria-label="keyboard shortcuts"></button>
        <button type="button" id="theme" class="ghost icon" aria-label="theme"></button>
        <button type="button" id="lang" class="ghost sm" title="中文 / English">EN</button>
        <button type="button" id="logout" class="ghost sm hidden" data-i18n="logout">退出</button>
      </div>
    </header>
    <main id="main">
      <div class="login-wrap hidden" id="login-wrap">
        <section id="login" class="card hidden">
          <div class="lock" id="login-lock" aria-hidden="true"></div>
          <h2 data-i18n="login_title">需要令牌</h2>
          <p class="muted" data-i18n="login_hint">此服务设置了 Bearer 令牌。令牌只保存在本标签页的 sessionStorage 中，关闭标签页即清除。</p>
          <form id="login-form" autocomplete="off">
            <label for="token-input" data-i18n="token">令牌</label>
            <input id="token-input" type="password" autocomplete="off" spellcheck="false" required>
            <button type="submit" class="primary" data-i18n="login">登录</button>
            <p id="login-error" class="error" role="alert"></p>
          </form>
        </section>
      </div>
      <section id="view" aria-live="polite"></section>
    </main>
  </div>
</div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-box">
    <div class="modal-head"><h2 id="modal-title"></h2><button type="button" id="modal-close" class="ghost icon sm" aria-label="close"></button></div>
    <div id="modal-body"></div>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="toast" class="hidden" role="status"></div>
<noscript>需要启用 JavaScript / JavaScript is required.</noscript>
</body>
</html>
