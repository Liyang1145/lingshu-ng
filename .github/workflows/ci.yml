name: ci
on:
  push:
  pull_request:
jobs:
  core-minimal:
    # 核心零外部依赖：只装 pytest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      LINGSHU_NG_SEM: "off"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest -q tests_ng
        shell: bash
  full:
    runs-on: ubuntu-latest
    env:
      LINGSHU_NG_SEM: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest numpy Pillow
      - run: python -m pytest -q tests_ng
      # 各插件 conftest 同名，分开跑避免模块名冲突
      - run: for d in plugins/*/tests_*; do echo "== $d"; python -m pytest -q "$d" || exit 1; done
        shell: bash
  adapters:
    # 生态适配器：装 langchain-core / llama-index-core / mem0 对照，跑官方标准套件
    runs-on: ubuntu-latest
    env:
      LINGSHU_NG_SEM: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pytest-asyncio "langchain-core>=1.6,<2" langchain-tests "llama-index-core>=0.14,<0.15"
      - run: python -m pytest -q plugins/lingshu-ng-adapters/tests_adapters
  docker:
    # 镜像可构建、非 root、带令牌能起服务、/healthz 正常、无令牌拒绝启动
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lingshu-ng:ci .
      - run: |
          docker run -d --name ls -p 8765:8765 -e LINGSHU_NG_TOKEN=ci-token lingshu-ng:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/healthz && break; sleep 1; done
          curl -fsS -H "Authorization: Bearer ci-token" -X POST -d '{"content":"docker smoke"}' http://127.0.0.1:8765/v1/perceive
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/v1/status)" = 401
          test "$(docker exec ls id -u)" = 10001
          docker rm -f ls
          ! docker run --rm lingshu-ng:ci
  console-e2e:
    # 控制台真实浏览器端到端（Playwright + Chromium）
    runs-on: ubuntu-latest
    env:
      LINGSHU_NG_SEM: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests_e2e
  release-artifacts:
    # E6-1：构建核心 wheel/sdist，生成 CycloneDX SBOM 与 SHA256SUMS，作为 CI 产物可下载
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build "setuptools>=77" wheel
      - run: python tools/release/repro_check.py
      - run: rm -rf dist && python -m build --outdir dist .
      - run: python tools/release/sbom.py -o dist/lingshu-ng.cdx.json
      - run: |
          cd dist && python ../tools/release/checksums.py *.whl *.tar.gz lingshu-ng.cdx.json > SHA256SUMS
          python ../tools/release/checksums.py --check SHA256SUMS
          python ../tools/release/checksums.py --markdown *.whl *.tar.gz lingshu-ng.cdx.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: lingshu-ng-release
          path: dist/
