name: ci
on:
  push:
  pull_request:
jobs:
  core-minimal:
    # 核心零外部依赖：只装 pytest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      LINGSHU_NG_SEM: "off"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest -q tests_ng
        shell: bash
  full:
    runs-on: ubuntu-latest
    env:
      LINGSHU_NG_SEM: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest numpy Pillow
      - run: python -m pytest -q tests_ng
      # 各插件 conftest 同名，分开跑避免模块名冲突
      - run: for d in plugins/*/tests_*; do echo "== $d"; python -m pytest -q "$d" || exit 1; done
        shell: bash
  adapters:
    # 生态适配器：装 langchain-core / llama-index-core / mem0 对照，跑官方标准套件
    runs-on: ubuntu-latest
    env:
      LINGSHU_NG_SEM: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pytest-asyncio "langchain-core>=1.6,<2" langchain-tests "llama-index-core>=0.14,<0.15"
      - run: python -m pytest -q plugins/lingshu-ng-adapters/tests_adapters
